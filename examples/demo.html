<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RevisionLock demo</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { max-width: 760px; margin: 0 auto; padding: 56px 24px; background: #08101e; color: #edf4ff; }
      .eyebrow { color: #8db8ff; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 620px; font-size: clamp(38px, 7vw, 70px); line-height: .98; letter-spacing: -.06em; }
      p { color: #b7c6da; line-height: 1.6; }
      .card { margin-top: 34px; padding: 22px; border: 1px solid #263b5a; border-radius: 18px; background: #0c192d; }
      textarea { display: block; width: 100%; min-height: 130px; box-sizing: border-box; margin: 18px 0; padding: 14px; resize: vertical; border: 1px solid #42618e; border-radius: 12px; background: #071225; color: #edf4ff; font: inherit; }
      button { cursor: pointer; margin: 0 8px 8px 0; padding: 10px 14px; border: 1px solid #5478ae; border-radius: 999px; background: #173052; color: #edf4ff; font: inherit; }
      button[type="submit"] { background: #8db8ff; border-color: #b8d4ff; color: #071225; font-weight: 800; }
      #result { min-height: 24px; color: #9fe2b1; }
    </style>
  </head>
  <body>
    <p class="eyebrow">RevisionLock demo</p>
    <h1>See what happens when the page moves under your draft.</h1>
    <p>Type a reply, simulate a page update, then try to send. The guard pauses the send so you can choose.</p>
    <section class="card">
      <p id="revision">Page revision: 1 · The review context is current.</p>
      <button id="change" type="button">Simulate page update</button>
      <form id="reply-form">
        <textarea aria-label="Reply" placeholder="Write a reply…">I will review the current page and reply.</textarea>
        <button type="submit">Send reply</button>
      </form>
      <p id="result" aria-live="polite"></p>
    </section>
    <script>
      const revision = document.querySelector("#revision");
      let version = 1;
      document.querySelector("#change").addEventListener("click", () => {
        version += 1;
        revision.textContent = `Page revision: ${version} · This context changed after your draft started.`;
      });
      document.querySelector("#reply-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector("#result").textContent = "Sent by demo form.";
      });
    </script>
    <script src="/dist/content.js"></script>
  </body>
</html>
